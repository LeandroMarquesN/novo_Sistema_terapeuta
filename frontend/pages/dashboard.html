        /* INÍCIO DAS MODIFICAÇÕES DO FULLCALENDAR */

        /* estlizaão efeito bolha calendario */

.fc-event-main {
    cursor: pointer;
}

/* Deixa o texto dos pacientes mais legível */

/* Personalização da Bolha (Tippy) */

    <!-- modal pacientes quando clica -->
     <!-- MOdal para poup-up pacientes do calendario -->
     <div class="modal fade" id="modalAcoesPaciente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Lógica de Cálculo Lunar (ESSENCIAL)
        function obterFaseLunar(data) {
            const dataReferencia = new Date(2024, 0, 11, 12, 0, 0);
            const cicloLunar = 29.530588853;
            const diffDias = (data - dataReferencia) / (1000 * 60 * 60 * 24);
            const fase = (diffDias / cicloLunar) % 1;
            const f = fase < 0 ? fase + 1 : fase;

            if (f < 0.03 || f > 0.97) return { nome: 'Nova', emoji: '🌑' };
            if (f >= 0.22 && f <= 0.28) return { nome: 'Quarto Crescente', emoji: '🌓' };
            if (f >= 0.47 && f <= 0.53) return { nome: 'Cheia', emoji: '🌕' };
            if (f >= 0.72 && f <= 0.78) return { nome: 'Quarto Minguante', emoji: '🌗' };
            return null;
        }

        // 2. Inicialização do Calendário
        async function inicializarCalendario() {
            const calendarEl = document.getElementById('calendar');
            const anoAtual = new Date().getFullYear();
            const eventosLuas = [];

            for (let m = 0; m < 12; m++) {
                for (let d = 1; d <= 31; d++) {
                    const data = new Date(anoAtual, m, d);
                    if (data.getMonth() !== m) break;
                    const infoLua = obterFaseLunar(data);
                    if (infoLua) {
                        eventosLuas.push({
                            title: infoLua.emoji,
                            start: data.toISOString().split('T')[0],
                            allDay: true,
                            display: 'block',
                            backgroundColor: 'transparent',
                            borderColor: 'transparent',
                            extendedProps: { tipo: 'LUA', info: `Lua ${infoLua.nome}` }
                        });
                    }
                }
            }

          const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'pt-br',
    themeSystem: 'bootstrap5',
    events: eventosLuas,

    // --- ADICIONE ESTE BLOCO ABAIXO ---
    eventClick: function(info) {
        // Se for clique na Lua, ignora
        if (info.event.extendedProps.tipo === 'LUA') return;

        const evento = info.event;
        const dados = evento.extendedProps;

        // 1. Preenche os dados no modal de ações
        document.getElementById('tituloModalAcoes').innerText = `Paciente: ${evento.title}`;
        document.getElementById('infoResumoAgendamento').innerHTML = `Agendamento para: <strong>${new Date(evento.start).toLocaleString('pt-BR')}</strong>`;

        // 2. Ação: Ver Informações (reutiliza sua função original)
        document.getElementById('btnVerInfo').onclick = function() {
            bootstrap.Modal.getInstance(document.getElementById('modalAcoesPaciente')).hide();
            // Passa os dados salvos no originalData
            abrirModalPaciente(encodeURIComponent(JSON.stringify(dados.originalData)));
        };

        // 3. Ação: WhatsApp
        document.getElementById('btnWhatsApp').onclick = function() {
            const tel = dados.originalData.telefone || "";
            const msg = encodeURIComponent(`Olá ${evento.title}, confirmo seu atendimento em ${new Date(evento.start).toLocaleDateString('pt-BR')}.`);
            window.open(`https://web.whatsapp.com/send?phone=55${tel}&text=${msg}`, '_blank');
        };

        // 4. Ação: Reagendar
        document.getElementById('btnReagendarModal').onclick = function() {
            bootstrap.Modal.getInstance(document.getElementById('modalAcoesPaciente')).hide();
            // Abre seu modal de reagendamento padrão
            const modalReagendar = new bootstrap.Modal(document.getElementById('modalReagendamento'));
            document.getElementById('reagendarPaciente').value = evento.title;
            document.getElementById('reagendarId').value = evento.id;
            modalReagendar.show();
        };

        // 5. Mostra o modal de escolha
        const modalAcoes = new bootstrap.Modal(document.getElementById('modalAcoesPaciente'));
        modalAcoes.show();
    },
    // --- FIM DO BLOCO DE CLIQUE ---

    eventDidMount: function(info) {
        let conteudo = info.event.extendedProps.tipo === 'LUA'
            ? `<strong>${info.event.extendedProps.info}</strong>`
            : `<strong>Paciente:</strong> ${info.event.title}`;

        if (typeof tippy === 'function') {
            tippy(info.el, {
                content: conteudo,
                allowHTML: true,
                theme: 'light-border',
                placement: 'top'
            });
        }
    }
});

calendar.render();

            // Carregar Agendamentos da API
            try {
                const res = await fetch('http://localhost:3000/api/agendamentos');
                const agendamentos = await res.json();
                const eventosApi = agendamentos.map(item => ({
                    title: item.nome,
                    start: item.data_agendamento,
                    color: '#28a745',
                    extendedProps: { tipo: 'PACIENTE' }
                }));
                calendar.addEventSource(eventosApi);
            } catch (e) { console.error("Erro API:", e); }
        }

        // 3. Inicialização Geral
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = localStorage.getItem('usuarioLogado');
            if (!usuario) window.location.href = 'login.html';
            document.getElementById('boasVindas').innerText = `Olá, ${usuario}!`;

            atualizarDataHora();
            setInterval(atualizarDataHora, 1000);
            inicializarCalendario();
        });

        function atualizarDataHora() {
            const now = new Date();
            document.getElementById('data-hora').textContent = now.toLocaleString('pt-BR');
        }
    </script>
