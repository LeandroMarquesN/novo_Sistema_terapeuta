<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashBordStyle.css">
  <link rel="stylesheet" href="/css/animacaoBack.css">
  <link rel="stylesheet" href="/css/maquinaEscrever.css">

  <style>
    #calendar {
      min-height: 500px;
    }
  </style>

  <!-- FullCalendar v5 CSS e JS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema Terapeuta</a>
      <div>
        <a href="pacientes.html" class="btn btn-outline-primary me-2">Pacientes</a>
        <a href="agendamento.html" class="btn btn-outline-success me-2">Agendar</a>
        <a href="historico.html" class="btn btn-outline-secondary">Histórico</a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container mt-5">
    <div class="text-center mb-4">
      <h1 id="boasVindas" class="fs-2 fw-bold">Bem-vinda!</h1>
      <p class="fs-5">Você está logada no sistema do terapeuta!</p>
    </div>

    <p class="fs-5">Aqui você poderá visualizar seus agendamentos.</p>

    <div class="border p-4 bg-white rounded shadow-sm mt-4 overflow-auto">
      <div id="calendar"></div>
    </div>
  </div>

  <!-- Boas-vindas -->
  <script>
    const usuario = localStorage.getItem('usuarioLogado');

    function escreverTextoComMaquinaEscrever(texto, elementoId) {
      const elemento = document.getElementById(elementoId);
      elemento.textContent = "";
      elemento.classList.remove("typewriter");

      let i = 0;
      const intervalo = setInterval(() => {
        elemento.textContent += texto.charAt(i);
        i++;
        if (i >= texto.length) {
          clearInterval(intervalo);
          elemento.classList.add("typewriter");
        }
      }, 100);
    }

    if (usuario) {
      const nomeParts = usuario.trim().split(' ');
      const primeiroNome = nomeParts[0].toLowerCase();
      const terminaComA = primeiroNome.endsWith('a');

      const icone = terminaComA ? "👩‍⚕️" : "👨‍⚕️";
      const saudacao = terminaComA
        ? `Bem-vinda, ${usuario} ${icone}`
        : `Bem-vindo, ${usuario} ${icone}`;

      escreverTextoComMaquinaEscrever(saudacao, 'boasVindas');
    } else {
      window.location.href = 'login.html';
    }
  </script>

  <!-- Calendário -->
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const calendarEl = document.getElementById('calendar');

      let eventosApi = [];

      try {
        const resposta = await fetch('/api/agendamentos');
        const agendamentos = await resposta.json();
        console.log('Agendamentos recebidos da API:', agendamentos);

        eventosApi = agendamentos.map(item => ({
          title: item.nome + ' - ' + item.tipo_terapia,
          start: item.data, // Ex: "2025-07-15T14:00:00"
          color: '#198754'
        }));
      } catch (error) {
        console.error('Erro ao buscar agendamentos:', error);
        alert('Não foi possível carregar os agendamentos.');
      }

      const luas = [
        { title: '🌕 Lua Cheia', start: '2025-07-21', color: '#a0c4ff' },
        { title: '🌑 Lua Nova', start: '2025-07-06', color: '#d0bfff' },
        { title: '🌕 Lua Cheia', start: '2025-08-19', color: '#a0c4ff' },
        { title: '🌑 Lua Nova', start: '2025-08-04', color: '#d0bfff' }
      ];

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 500,
        locale: 'pt-br',
        headerToolbar: {
          start: 'title',
          center: '',
          end: 'today prev,next'
        },
        events: [...eventosApi, ...luas]
      });

      calendar.render();
    });
  </script>
</body>
</html>
