<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashBordStyle.css">
  <link rel="stylesheet" href="/css/animacaoBack.css">
  <link rel="stylesheet" href="/css/maquinaEscrever.css">
  <link rel="stylesheet" href="/css/transicaoTela.css">

  <style>
    /* Fonte da menssagem de boas vindas */
    @font-face {
      font-family: 'FonteDoLogo';
      src: url('/fonts/nome-da-sua-fonte.woff2') format('woff2'),
          url('/fonts/nome-da-sua-fonte.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    #boasVindas {
      font-family: 'FonteDoLogo', sans-serif;
      /* Garante que a fonte seja aplicada */
    }
    /* Fim da menssagem */
    /* Estilização da Navbar (já estava funcionando) */
    span.logo-img {
      height: 280px;
      width: 650px;
      background-image: url('../logo/logoFinal.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: left;
      display: inline-block;
      text-indent: -9999px;
      overflow: hidden;
    }
    .bg-transparente {
      background-color: transparent !important;
    }

    /* Estilos para as caixas com transparência e bordas arredondadas */
    .dashboard-box {
      /* Fundo branco com opacidade reduzida (quase transparente) */
      background-color: rgba(255, 255, 255, 0.3);
      /* Borda sutil para definir o elemento */
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      padding: 1.5rem;
      backdrop-filter: blur(5px); /* Efeito de vidro fosco, opcional */
    }

    /* Esconde o cabeçalho da tabela */
    .dashboard-box .table thead {
        display: none;
    }

    /* Remove o fundo branco padrão do Bootstrap nas linhas da tabela */
    .dashboard-box .table-striped tbody tr:nth-of-type(odd) {
        background-color: transparent !important;
    }
    /* Estilo para as linhas da tabela (item de notificação) */
    .dashboard-box .table tbody tr {
        /* Fundo suavemente transparente para cada linha */
        background-color: rgba(255, 255, 255, 0.2);
        margin-bottom: 1rem; /* Espaçamento entre as linhas */
        border-radius: 0.5rem; /* Bordas arredondadas para cada linha */
        border: none; /* Remove a borda da tabela */
        transition: transform 0.2s ease-in-out;
    }
    .dashboard-box .table tbody tr:hover {
        transform: scale(1.02); /* Efeito sutil ao passar o mouse */
    }
    /* Garante que o espaçamento seja aplicado corretamente */
    .dashboard-box .table tbody tr td {
        border-top: none;
        padding: 1rem;
    }

    /* Customizações do FullCalendar para o estilo clean */
    .fc .fc-toolbar.fc-header-toolbar {
      margin-bottom: 1.5em;
      cursor:pointer;
    }
    .fc-toolbar-title {
      font-size: 1.75em;
      font-weight: 500;
      color: #333;
    }
    .fc .fc-button-primary {
      background-color: transparent;
      border: 1px solid #ccc;
      color: #555;
      font-weight: 500;
      padding: 0.5rem 1rem;
    }
    .fc .fc-button-primary:hover,
    .fc .fc-button-primary:not(:disabled):active {
      background-color: #f0f0f0;
      border-color: #bbb;
      box-shadow: none;
    }
    .fc-theme-standard th {
      font-weight: 600;
      color: #6c757d;
      background-color: transparent;
      border: none;
    }
    .fc-daygrid-day {
      border: 1px solid #e9ecef;
    }
    .fc-event {
      border: none;
      font-size: 0.85rem;
      padding: 3px 5px;
      border-radius: 4px;
    }
    .fc-event[style*="background-color: rgb(25, 135, 84);"] {
      background-color: #28a745 !important;
      color: #fff;
    }
    .fc-event[style*="background-color: rgb(160, 196, 255);"] {
      background-color: #a0c4ff !important;
      color: #343a40;
    }
    .fc-event[style*="background-color: rgb(208, 191, 255);"] {
      background-color: #d0bfff !important;
      color: #343a40;
    }
  </style>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-transparente fade-in-element">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <span class="logo-img" href="dashboard.html">Sistema Terapeuta</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="btn btn-outline-primary me-2" href="pacientes.html">Pacientes</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-success me-2" href="agendamento.html">Agendar</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-secondary" href="historico.html">Histórico</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-5">
    <div class="text-center mb-4 fade-in-element">
      <h1 id="boasVindas" class="fs-2 fw-bold">Bem-vinda!</h1>
      <p class="fs-5">Você está logada no sistema do terapeuta!</p>
    </div>

    <p class="fs-5 fade-in-element">Próximos agendamentos:</p>

    <div class="dashboard-box mt-4 fade-in-element">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Paciente</th>
              <th>Data e Hora</th>
              <th>Terapia</th>
            </tr>
          </thead>
          <tbody id="tabelaAgendamentos">
            <tr>
              <td colspan="3" class="text-center text-muted">Carregando agendamentos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="dashboard-box mt-4 fade-in-element">
      <div id="calendar"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const usuario = localStorage.getItem('usuarioLogado');

function escreverTextoComMaquinaEscrever(texto, elementoId) {
  const elemento = document.getElementById(elementoId);
  elemento.textContent = "";
  // Adiciona a classe da fonte ao elemento antes de começar a escrever
  elemento.classList.add("font-logo");
  elemento.classList.remove("typewriter");

  let i = 0;
  const intervalo = setInterval(() => {
    elemento.textContent += texto.charAt(i);
    i++;
    if (i >= texto.length) {
      clearInterval(intervalo);
      elemento.classList.add("typewriter");
    }
  }, 100);
}

if (usuario) {
  const nomeParts = usuario.trim().split(' ');
  const primeiroNome = nomeParts[0].toLowerCase();
  const terminaComA = primeiroNome.endsWith('a');

  const icone = terminaComA ? "👩‍⚕️" : "👨‍⚕️";
  const saudacao = terminaComA
    ? `Bem-vinda, ${usuario} ${icone}`
    : `Bem-vindo, ${usuario} ${icone}`;

  escreverTextoComMaquinaEscrever(saudacao, 'boasVindas');
} else {
  window.location.href = 'login.html';
}
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const calendarEl = document.getElementById('calendar');

      let eventosApi = [];

      try {
        const resposta = await fetch('/api/agendamentos');
        const agendamentos = await resposta.json();

        eventosApi = agendamentos.map(item => ({
          title: item.nome + ' - ' + item.tipo_terapia,
          start: new Date(item.data_agendamento).toISOString(),
          color: '#28a745'
        }));
      } catch (error) {
        console.error('Erro ao buscar agendamentos para o calendário:', error);
      }

      const luas = [
        { title: '🌕 Lua Cheia', start: '2025-07-21', color: '#a0c4ff' },
        { title: '🌑 Lua Nova', start: '2025-07-06', color: '#d0bfff' },
        { title: '🌕 Lua Cheia', start: '2025-08-19', color: '#a0c4ff' },
        { title: '🌑 Lua Nova', start: '2025-08-04', color: '#d0bfff' }
      ];

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 500,
        locale: 'pt-br',
        themeSystem: 'bootstrap5',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        events: [...eventosApi, ...luas]
      });

      calendar.render();
    });
  </script>

  <script>
    async function carregarTabelaAgendamentos() {
      const tabelaBody = document.getElementById('tabelaAgendamentos');
      tabelaBody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Carregando agendamentos...</td></tr>';

      try {
        const resposta = await fetch('/api/agendamentos');
        if (!resposta.ok) {
          throw new Error(`Erro HTTP: ${resposta.status}`);
        }
        const agendamentos = await resposta.json();
        tabelaBody.innerHTML = '';

        if (agendamentos.length === 0) {
          tabelaBody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Nenhum agendamento futuro encontrado.</td></tr>`;
          return;
        }

        const agendamentosFuturos = agendamentos.filter(agendamento => {
          const dataAgendamento = new Date(agendamento.data_agendamento);
          return dataAgendamento > new Date();
        }).sort((a, b) => new Date(a.data_agendamento) - new Date(b.data_agendamento));

        if (agendamentosFuturos.length === 0) {
          tabelaBody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Nenhum agendamento futuro encontrado.</td></tr>`;
          return;
        }

        const proximosAgendamentos = agendamentosFuturos.slice(0, 10);

        proximosAgendamentos.forEach(agendamento => {
          const tr = document.createElement('tr');
          const dataFormatada = new Date(agendamento.data_agendamento).toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          tr.innerHTML = `
            <td>${agendamento.nome || 'N/A'}</td>
            <td>${dataFormatada}</td>
            <td>${agendamento.tipo_terapia || 'N/A'}</td>
          `;
          tabelaBody.appendChild(tr);
        });
      } catch (erro) {
        console.error('Erro ao carregar agendamentos para a tabela:', erro);
        tabelaBody.innerHTML = `<tr><td colspan="3" class="text-center text-danger">Erro ao carregar a lista de agendamentos.</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      carregarTabelaAgendamentos();
    });
  </script>
</body>
</html>
