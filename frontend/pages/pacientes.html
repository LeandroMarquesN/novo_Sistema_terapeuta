<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Prontuário de Pacientes | Sistema Terapeuta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/stiloDataHora.css">
  <link rel="stylesheet" href="../css/stileLogo.css">
  <link rel="stylesheet" href="../css/darckModeStile.css">
  <link rel="stylesheet" href="../css/prontuarioModal.css">
  <script src="../ScriptGlobal/BloqBotVoltar.js"></script>
  <link rel="stylesheet" href="../css/animacaoBack.css">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #858796;
      --success-color: #1cc88a;
      --bg-body: #f8f9fc;
    }

    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: #333; }

    /* Logo adaptada */
    .logo-container { padding: 20px 0; }
    .logo-img { max-height: 80px; width: auto; }

    /* Cards de Pacientes */
    .patient-card {
      background: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary-color);
    }
    .patient-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

    /* Estilo Dark Mode */
    body.dark-mode { background-color: #1a1a1a; color: #f4f4f4; }
    body.dark-mode .patient-card { background: #2d2d2d; color: white; }

    .search-bar {
      border-radius: 30px;
      padding: 12px 25px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Modal de Prontuário */
    .modal-content { border-radius: 15px; border: none; }
    .history-line { border-left: 2px solid #e3e6f0; padding-left: 20px; position: relative; margin-bottom: 15px; }
    .history-line::before {
        content: ''; position: absolute; left: -7px; top: 5px;
        width: 12px; height: 12px; background: var(--primary-color); border-radius: 50%;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-transparente fade-in-element">
    <div class="container-fluid">
          <a class="navbar-brand" href="/dashboard">
            <span class="logo-img">Sistema Terapeuta</span>
          </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ms-auto d-flex align-items-center">
                    <div id="data-hora-container">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="data-hora"></span>
                    </div>
                    <a href="/dashboard" class="btn btn-outline-primary me-2">dashboard</a>

                    <a href="/agendamento" class="btn btn-outline-success me-2">Agendar</a>
                    <a href="/equipe" class="btn btn-outline-success me-2">Minha Equipe</a>
                    <!-- Logout -->
                    <a href="javascript:void(0)" onclick="handleLogout(event)" class="btn btn-outline-danger">
                      <i class="fas fa-sign-out-alt"></i> Sair
                  </a>
                    <button id="theme-toggle-btn" class="btn btn-outline-dark ms-2">
                        <i class="fas fa-moon"></i>
                    </button>
            </div>
        </div>
    </div>
  </nav>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/pacientes">
        <i class="fas fa-notes-medical me-2"></i>Aqui você pode ver os seus pacientes
      </a>

    </div>
  </nav>

  <div class="container">
    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <h2 class="fw-bold">Gestão de Pacientes</h2>
        <p class="text-muted">Consulte prontuários e históricos clínicos.</p>
      </div>
      <div class="col-md-6 text-end">
        <input type="text" id="inputBusca" class="form-control search-bar" placeholder="🔍 Buscar por Nome ou CPF..." onkeyup="filtrarPacientes()">
      </div>
    </div>

    <div id="container-pacientes" class="row">
        <div class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Carregando pacientes...</p>
        </div>
    </div>
  </div>

  <div class="modal fade modal-glass" id="modalProntuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-card shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Prontuário Digital</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-4" id="corpoModalProntuario">
                </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- CARREGAR PACIENTES (FRONTEND) ---
    async function carregarPacientes() {
  try {
    const token = localStorage.getItem('token'); // Pega o crachá
    const res = await fetch('/api/pacientes', {
      headers: {
        'Authorization': `Bearer ${token}` // Mostra o crachá
      }
    });

    const pacientes = await res.json();

    // Trava de segurança: Se não for uma lista, não tenta dar .map
    if (!Array.isArray(pacientes)) {
      console.error("Backend retornou erro:", pacientes);
      return;
    }

    const container = document.getElementById('container-pacientes');

        container.innerHTML = pacientes.map(p => `
          <div class="col-md-6 col-lg-4 item-paciente">
            <div class="card patient-card">
              <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                  <div class="bg-light rounded-circle p-3 me-3">
                    <i class="fas fa-user text-primary fa-2x"></i>
                  </div>
                  <div>
                    <h5 class="card-title mb-0 fw-bold">${p.nome}</h5>
                    <small class="text-muted">CPF: ${p.cpf || 'Não informado'}</small>
                  </div>
                </div>
                <p class="card-text mb-1"><i class="fas fa-phone me-2 text-muted"></i>${p.telefone}</p>
                <p class="card-text mb-3"><i class="fas fa-envelope me-2 text-muted"></i>${p.email}</p>

                <div class="d-flex justify-content-between">
                  <button class="btn btn-primary btn-sm w-100 me-2" onclick="verProntuario(${p.id})">
                    <i class="fas fa-file-medical me-1"></i> Prontuário
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="deletarPaciente(${p.id})">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Erro ao buscar pacientes", e);
      }
    }

    // --- VER PRONTUÁRIO (DETALHES) ---
    async function verProntuario(id) {
    // 1. Capturamos o elemento que vai receber o HTML (Isso resolve o ReferenceError)
    const modalProntuarioEl = document.getElementById('modalProntuario');
    const conteudo = document.getElementById('corpoModalProntuario');

    if (!conteudo) {
        console.error("Erro: O elemento 'corpoModalProntuario' não foi encontrado no HTML.");
        return;
    }

    // Mostra um spinner moderno enquanto carrega
    conteudo.innerHTML = `
        <div class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Buscando histórico médico...</p>
        </div>`;

    const modalBootstrap = new bootstrap.Modal(modalProntuarioEl);
    modalBootstrap.show();

    try {
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/pacientes/${id}/prontuario`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error();
        const data = await res.json();

        // 2. Renderizamos o conteúdo moderno
        conteudo.innerHTML = `
            <div class="row mb-4">
                <div class="col-md-4 text-center">
                    <img src="${data.dados.foto_perfil ? '/uploads/'+data.dados.foto_perfil : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"
                         class="img-thumbnail rounded-circle mb-2 shadow-sm"
                         style="width:120px; height:120px; object-fit:cover; border: 4px solid white;">
                    <h5 class="fw-bold text-dark mt-2">${data.dados.nome}</h5>
                    <span class="badge rounded-pill bg-light text-primary border border-primary">Paciente Ativo</span>
                </div>
                <div class="col-md-8">
                    <div class="row g-3">
                        <div class="col-6">
                            <small class="text-muted d-block">Idade</small>
                            <span class="fw-bold">${data.dados.idade || '--'} anos</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Tipo Sanguíneo</small>
                            <span class="badge bg-danger">${data.dados.tipo_sanguineo || 'N/A'}</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Peso</small>
                            <span class="fw-bold">${data.dados.peso || '--'} kg</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Altura</small>
                            <span class="fw-bold">${data.dados.altura || '--'} m</span>
                        </div>
                    </div>
                    <hr class="my-3 opacity-25">
                    <div class="bg-white p-3 rounded-3 border">
                        <h6 class="small fw-bold text-uppercase text-muted mb-2">Condições Preexistentes</h6>
                        <p class="mb-0 small text-dark">${data.dados.condicoes_preexistentes || 'Nenhuma informada.'}</p>
                    </div>
                </div>
            </div>

            <h6 class="fw-bold text-primary mb-3 d-flex align-items-center">
                <i class="fas fa-notes-medical me-2"></i> Histórico de Consultas
            </h6>

            <div class="history-list p-2">
                ${data.consultas && data.consultas.length > 0 ? data.consultas.map(c => `
                    <div class="history-line">
                        <div class="d-flex justify-content-between align-items-start">
                            <small class="text-primary fw-bold bg-primary-subtle px-2 py-1 rounded">
                                ${new Date(c.data_agendamento.replace('T', ' ').replace('Z', '')).toLocaleDateString('pt-BR')}
                            </small>
                        </div>
                        <p class="mt-2 mb-1"><strong>${c.tipo_terapia}</strong></p>
                        <p class="text-muted small">${c.motivo_consulta || 'Sem descrição clínica.'}</p>
                    </div>
                `).join('') : '<div class="text-center p-4 text-muted">Nenhuma consulta realizada ainda.</div>'}
            </div>
        `;
    } catch (e) {
        conteudo.innerHTML = `
            <div class="alert alert-danger border-0 bg-danger-subtle text-danger">
                <i class="fas fa-exclamation-circle me-2"></i> Erro ao carregar prontuário.
            </div>`;
    }
}



    // --- FILTRO DE BUSCA ---
    function filtrarPacientes() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const cards = document.querySelectorAll('.item-paciente');

      cards.forEach(card => {
        const texto = card.innerText.toLowerCase();
        card.style.display = texto.includes(termo) ? 'block' : 'none';
      });
    }

    // Inicialização
    carregarPacientes();
  </script>
  <script src="../ScriptGlobal/FuncDataHora.js"></script>
  <script src="../ScriptGlobal/DarkMode.js"></script>
  <script src="../ScriptGlobal/verifiLog.js"></script>
  <script src="../ScriptGlobal/logout.js"></script>
</body>
</html>
