<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Prontuário de Pacientes | Sistema Terapeuta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #858796;
      --success-color: #1cc88a;
      --bg-body: #f8f9fc;
    }

    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: #333; }
    
    /* Logo adaptada */
    .logo-container { padding: 20px 0; }
    .logo-img { max-height: 80px; width: auto; }

    /* Cards de Pacientes */
    .patient-card {
      background: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary-color);
    }
    .patient-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

    /* Estilo Dark Mode */
    body.dark-mode { background-color: #1a1a1a; color: #f4f4f4; }
    body.dark-mode .patient-card { background: #2d2d2d; color: white; }

    .search-bar {
      border-radius: 30px;
      padding: 12px 25px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Modal de Prontuário */
    .modal-content { border-radius: 15px; border: none; }
    .history-line { border-left: 2px solid #e3e6f0; padding-left: 20px; position: relative; margin-bottom: 15px; }
    .history-line::before { 
        content: ''; position: absolute; left: -7px; top: 5px; 
        width: 12px; height: 12px; background: var(--primary-color); border-radius: 50%; 
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
        <i class="fas fa-notes-medical me-2"></i>SISTEMA TERAPEUTA
      </a>
      <div class="ms-auto">
        <a href="dashboard.html" class="btn btn-sm btn-outline-primary">Home</a>
        <a href="agendamento.html" class="btn btn-sm btn-success">Novo Agendamento</a>
        <button id="theme-toggle-btn" class="btn btn-sm btn-light ms-2"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <h2 class="fw-bold">Gestão de Pacientes</h2>
        <p class="text-muted">Consulte prontuários e históricos clínicos.</p>
      </div>
      <div class="col-md-6 text-end">
        <input type="text" id="inputBusca" class="form-control search-bar" placeholder="🔍 Buscar por Nome ou CPF..." onkeyup="filtrarPacientes()">
      </div>
    </div>

    <div id="container-pacientes" class="row">
        <div class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Carregando pacientes...</p>
        </div>
    </div>
  </div>

  <div class="modal fade" id="modalProntuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fas fa-user-circle me-2"></i>Prontuário do Paciente</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="conteudo-prontuario">
          </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // --- CARREGAR PACIENTES (FRONTEND) ---
    async function carregarPacientes() {
      try {
        const res = await fetch('/api/pacientes'); // Sua nova rota
        const pacientes = await res.json();
        const container = document.getElementById('container-pacientes');
        
        container.innerHTML = pacientes.map(p => `
          <div class="col-md-6 col-lg-4 item-paciente">
            <div class="card patient-card">
              <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                  <div class="bg-light rounded-circle p-3 me-3">
                    <i class="fas fa-user text-primary fa-2x"></i>
                  </div>
                  <div>
                    <h5 class="card-title mb-0 fw-bold">${p.nome}</h5>
                    <small class="text-muted">CPF: ${p.cpf || 'Não informado'}</small>
                  </div>
                </div>
                <p class="card-text mb-1"><i class="fas fa-phone me-2 text-muted"></i>${p.telefone}</p>
                <p class="card-text mb-3"><i class="fas fa-envelope me-2 text-muted"></i>${p.email}</p>
                
                <div class="d-flex justify-content-between">
                  <button class="btn btn-primary btn-sm w-100 me-2" onclick="verProntuario(${p.id})">
                    <i class="fas fa-file-medical me-1"></i> Prontuário
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="deletarPaciente(${p.id})">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Erro ao buscar pacientes", e);
      }
    }

    // --- VER PRONTUÁRIO (DETALHES) ---
    async function verProntuario(id) {
        const modal = new bootstrap.Modal(document.getElementById('modalProntuario'));
        const conteudo = document.getElementById('conteudo-prontuario');
        conteudo.innerHTML = '<div class="text-center"><div class="spinner-border text-primary"></div></div>';
        modal.show();

        try {
            // Chamada para a rota que criamos no Controller
            const res = await fetch(`/api/pacientes/${id}/prontuario`);
            const data = await res.json();

            conteudo.innerHTML = `
                <div class="row mb-4">
                    <div class="col-md-4 text-center">
                        <img src="${data.dados.foto_perfil ? '/uploads/'+data.dados.foto_perfil : 'https://via.placeholder.com/150'}" class="img-thumbnail rounded-circle mb-2" style="width:120px; height:120px; object-fit:cover;">
                        <h6 class="fw-bold">${data.dados.nome}</h6>
                    </div>
                    <div class="col-md-8">
                        <div class="row">
                            <div class="col-6 mb-2"><strong>Idade:</strong> ${data.dados.idade || '--'}</div>
                            <div class="col-6 mb-2"><strong>Tipo Sanguíneo:</strong> <span class="badge bg-danger">${data.dados.tipo_sanguineo || 'N/A'}</span></div>
                            <div class="col-6 mb-2"><strong>Peso:</strong> ${data.dados.peso || '--'} kg</div>
                            <div class="col-6 mb-2"><strong>Altura:</strong> ${data.dados.altura || '--'} m</div>
                        </div>
                        <hr>
                        <h6><strong>Condições:</strong> ${data.dados.condicoes_preexistentes || 'Nenhuma informada.'}</h6>
                    </div>
                </div>
                
                <h6 class="fw-bold text-primary mb-3"><i class="fas fa-history me-2"></i>Histórico de Consultas</h6>
                <div class="history-list">
                    ${data.consultas.length > 0 ? data.consultas.map(c => `
                        <div class="history-line">
                            <small class="text-primary fw-bold">${new Date(c.data_agendamento).toLocaleDateString('pt-BR')}</small>
                            <p class="mb-0"><strong>${c.tipo_terapia}</strong>: ${c.motivo_consulta || 'Sem descrição'}</p>
                        </div>
                    `).join('') : '<p class="text-muted">Nenhuma consulta realizada ainda.</p>'}
                </div>
            `;
        } catch (e) {
            conteudo.innerHTML = '<p class="text-danger">Erro ao carregar prontuário.</p>';
        }
    }

    // --- FILTRO DE BUSCA ---
    function filtrarPacientes() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const cards = document.querySelectorAll('.item-paciente');
      
      cards.forEach(card => {
        const texto = card.innerText.toLowerCase();
        card.style.display = texto.includes(termo) ? 'block' : 'none';
      });
    }

    // Inicialização
    carregarPacientes();
  </script>
</body>
</html>
