<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Recuperar Senha - MedLM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" sizes="16x18" href="../logo/faviicon.png" type="image/x-icon">
  <style>
    /* Reaproveita os estilos visuais modernos do seu login.html */
    body { font-family: 'Inter', sans-serif; background-color: #020c12; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #cbd5e1; }
    .box { background: rgba(255,255,255,0.025); border: 1px solid rgba(52,211,153,0.15); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 20px; }
    .input-ctrl { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(52,211,153,0.2); border-radius: 12px; color: #fff; padding: 12px 14px; outline: none; margin-bottom: 16px; font-size: 14px; }
    .btn { width: 100%; background: linear-gradient(135deg, #0891b2, #059669); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .msg { display: none; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    .msg.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: #34d399; }
    .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }
  </style>
</head>
<body>
  <div class="box">
    <h2 class="title"><i class="fas fa-key" style="color:#34d399"></i> Recuperar Acesso</h2>
    <div id="feedback" class="msg"></div>
    <form id="forgotForm">
      <label style="font-size:11px; text-transform:uppercase; color:rgba(148,163,184,0.6); font-weight:700;">E-mail Cadastrado</label>
      <input type="email" id="email" class="input-ctrl" placeholder="seu@email.com" required>
      <button type="submit" class="btn" id="submitBtn">Enviar Instruções</button>
    </form>
    <div style="text-align:center; margin-top:16px;">
      <a href="/pages/login.html" style="font-size:12px; color:rgba(52,211,153,0.7); text-decoration:none;">Voltar para o Login</a>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const feedback = document.getElementById('feedback');
      const btn = document.getElementById('submitBtn');

      feedback.style.display = 'none';
      btn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        feedback.className = 'msg success';
        feedback.textContent = data.message || 'Se o e-mail for válido, as instruções foram enviadas.';
        feedback.style.display = 'block';
        btn.textContent = 'Enviado!';
      } catch (err) {
        feedback.className = 'msg error';
        feedback.textContent = 'Erro de conexão.';
        feedback.style.display = 'block';
        btn.textContent = 'Enviar Instruções';
      }
    });
  </script>
</body>
</html>
