<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro MedLM - Sistema Terapêutico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <i class="fas fa-clinic-medical text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Crie sua Clínica</h1>
            <p class="text-slate-500">Inicie seu teste grátis no MedLM hoje.</p>
        </div>

        <form id="formCadastro" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nome da Clínica</label>
                <input type="text" name="nome_clinica" required placeholder="Ex: Clínica Equilíbrio"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Seu Nome Completo</label>
                <input type="text" name="dono_nome" required placeholder="Seu nome"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">E-mail Profissional</label>
                <input type="email" name="email_master" required placeholder="E-mail da clinica por favor!"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">WhatsApp da Clínica (Pacientes)</label>
                    <input type="text" name="telefone_clinica" required placeholder="(00) 00000-0000"
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Telefone do Dono (Comercial)</label>
                    <input type="text" name="telefone_dono" required placeholder="(00) 00000-0000"
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Senha de Acesso</label>
                <input type="password" name="senha_master" required minlength="6" placeholder="No mínimo 6 caracteres"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <div class="flex items-start space-x-2 py-2">
                <input type="checkbox" id="termos" required class="mt-1 h-4 w-4 text-blue-600 border-slate-300 rounded">
                <label for="termos" class="text-xs text-slate-500 cursor-pointer">Ao se cadastrar, você concorda com os termos de uso e política de privacidade.</label>
            </div>

            <button type="submit" id="btnSubmit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-200 transition-all transform hover:scale-[1.02] active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                Criar Minha Clínica
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-slate-600">
            Já tem uma conta? <a href="login.html" class="text-blue-600 font-bold hover:underline">Fazer Login</a>
        </p>
    </div>

    <!-- ======== MODAL CLINICA ======= -->
    <div id="modalSucesso" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div style="background:white; padding:40px; border-radius:15px; text-align:center; max-width:400px; animation: slideIn 0.3s ease;">
            <div style="font-size: 50px; color: #2ecc71;">✅</div>
            <h2 style="color: #2c3e50;">Parabéns pela escolha!</h2>
            <p style="color: #7f8c8d; margin-top:15px;">
                Sua clínica <strong>MedLM</strong> já está ativa em nosso sistema.
            </p>
            <p style="font-size: 14px; color: #3498db;">
                Enviamos um e-mail com seus dados de acesso.
            </p>
            <button onclick="window.location.href='/'" style="background:#2ecc71; color:white; border:none; padding:12px 30px; border-radius:5px; cursor:pointer; margin-top:20px; font-weight:bold;">
                Acessar Sistema
            </button>
        </div>
    </div>

    <style>
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
    <!-- ===== fIM NODAL CLINICA ===== -->

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            const originalText = btnSubmit.innerText;

            // 1. Feedback visual: desativa o botão
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Processando...";

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                // 2. Chamada para a API (Caminho relativo para não quebrar na nuvem)
                const response = await fetch('/api/clinicas/register-clinica', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('modalSucesso').style.display = 'flex';
                } else {
                    // ERRO DO SERVIDOR (ex: e-mail já existe)
                    alert(result.error || "Erro ao criar clínica. Verifique os dados.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = originalText;
                }
            } catch (error) {
                console.error("Erro na conexão:", error);
                alert("Falha na conexão com o servidor.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = originalText;
            }
        });
    </script>
</body>
</html>
