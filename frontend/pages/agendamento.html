  <style>
    /* Estilo para a nav Bar e a Logo */
    span.logo-img {
      height: 280px; /* Aumentado para deixar o logo maior */
      width: 650px; /* Aumentado para manter a proporção, ajuste conforme necessário */
      background-image: url('../logo/logoFinal.png'); /* Caminho da imagem */

      background-repeat: no-repeat;
      background-position: left;
      display: inline-block; /* Para que o span respeite as dimensões de height e width */

      overflow: hidden; /* Oculta qualquer conteúdo extra */
    }
    .bg-transparente {
      background-color: transparent !important;
    }

    /* ============================== */
    /* Estilo para o botão flutuante de voltar */
    .btn-voltar-flutuante {
      position: fixed;
      bottom: 20px; /* Distância do fundo */
      right: 20px; /* Distância da direita */
      z-index: 1000; /* Garante que fique acima de outros elementos */
      width: 50px; /* Largura do botão */
      height: 50px; /* Altura do botão */
      border-radius: 50%; /* Torna o botão redondo */
      display: flex; /* Para centralizar o ícone/texto */
      align-items: center; /* Centraliza verticalmente */
      justify-content: center; /* Centraliza horizontalmente */
      font-size: 1.5rem; /* Tamanho do ícone */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Sombra elegante */
      transition: all 0.3s ease; /* Transição suave para hover */
      background-color: #007bff; /* Cor azul primária do Bootstrap */
      color: white; /* Cor do texto/ícone */
      border: none; /* Remove a borda padrão */
      text-decoration: none; /* Remove sublinhado para links */
    }

    .btn-voltar-flutuante:hover {
      background-color: #0056b3; /* Cor mais escura no hover */
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Sombra mais intensa no hover */
      transform: translateY(-2px); /* Pequeno efeito de elevação */
    }

    /* Estilos para os checkboxes maiores e com borda azul marinho */
    .form-check-input[type="checkbox"] {
      width: 1.5em;   /* Aumenta a largura do checkbox */
      height: 1.5em;  /* Aumenta a altura do checkbox */
      border: 2px solid #000080; /* Borda azul marinho */
      vertical-align: middle; /* Alinha o checkbox com o texto do label */
      margin-top: 0.15em; /* Ajusta o alinhamento vertical se necessário */
    }

    /* Garante que o ícone de marcação interna se ajuste ao tamanho */
    .form-check-input[type="checkbox"]:checked {
      background-color: #007bff; /* Mantém a cor de fundo padrão do Bootstrap */
      border-color: #007bff; /* Borda da cor de fundo quando marcado */
    }

    .form-check-label {
      line-height: 1.5em; /* Ajusta a altura da linha para alinhar com o checkbox */
      margin-left: 0.5em; /* Espaço entre o checkbox e o label */
    }

    /* Estilos para o Modal Customizado (para erros e confirmações) */
    .clinical-modal .modal-content {
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .clinical-modal .modal-header {
        background-color: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        padding: 1rem 1.5rem;
    }
    .clinical-modal .modal-title {
        font-weight: 600;
        color: #343a40;
    }
    .clinical-modal .modal-body {
        padding: 1.5rem;
        color: #495057;
        line-height: 1.6;
    }
    .clinical-modal .modal-footer {
        border-top: 1px solid #e9ecef;
        padding: 1rem 1.5rem;
        background-color: #f8f9fa;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
    }
    .clinical-modal .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        font-weight: 500;
    }
    .clinical-modal .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
        font-weight: 500;
    }
    /* Ícones no modal */
    .clinical-modal .modal-body .modal-icon {
        font-size: 2rem;
        margin-right: 15px;
        vertical-align: middle;
    }
    .clinical-modal .modal-body .modal-icon.error { color: #dc3545; }

    .clinical-modal .modal-body .modal-icon.info { color: #17a2b8; }
    .clinical-modal .modal-body .modal-icon.success { color: #28a745; }

  <!-- Modal Customizado para Alertas e Confirmações (Bootstrap Modal) -->
  <div class="modal fade clinical-modal" id="customAlertModal" tabindex="-1" aria-labelledby="customAlertModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="customAlertModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="customAlertModalMessage"></p>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Toastr.js JS (para mensagens rápidas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <script>
    console.log('Script agendamentos.html carregado.'); // Log de depuração: Primeiro log do script

    // Configuração do Toastr.js para um estilo mais clínico/clean
    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": true,
      "progressBar": true,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "300",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    };

    // Variável global para armazenar os agendamentos atuais (otimização para validação)
    let currentAppointments = [];
    const APPOINTMENT_DURATION_MS = 10 * 60 * 60 * 1000; // 10 horas em milissegundos

    // Função auxiliar para capitalizar a primeira letra de cada palavra
    function capitalizeWords(str) {
      if (!str) return '';
      return str.toLowerCase().split(' ').map(word => {
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    // --- Funções para o Modal Customizado (Substituindo SweetAlert2 para Alertas) ---
    const customAlertModal = new bootstrap.Modal(document.getElementById('customAlertModal'));
    const customAlertModalLabel = document.getElementById('customAlertModalLabel');
    const customAlertModalMessage = document.getElementById('customAlertModalMessage');
    const customAlertModalFooter = document.getElementById('customAlertModalFooter');

    function showClinicalAlert(title, message, iconType = 'info', confirmButtonText = 'Ok') {
        customAlertModalLabel.innerHTML = `<i class="modal-icon fas fa-fw fa-${iconType}"></i> ${title}`;
        customAlertModalMessage.innerHTML = message;
        customAlertModalFooter.innerHTML = `<button type="button" class="btn btn-primary" data-bs-dismiss="modal">${confirmButtonText}</button>`;

        // Adiciona classe de ícone ao título para coloração
        customAlertModalLabel.querySelector('.modal-icon').className = `modal-icon fas fa-fw fa-${iconType} ${iconType}`;

        customAlertModal.show();
    }

    function showClinicalConfirm(title, message) {
        return new Promise((resolve) => {
            customAlertModalLabel.innerHTML = `<i class="modal-icon fas fa-fw fa-question-circle"></i> ${title}`;
            customAlertModalMessage.innerHTML = message;
            customAlertModalLabel.querySelector('.modal-icon').className = `modal-icon fas fa-fw fa-question-circle warning`; // Cor de aviso para confirmação

            customAlertModalFooter.innerHTML = `
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="confirmClinicalModalBtn">Confirmar</button>
            `;

            const confirmBtn = document.getElementById('confirmClinicalModalBtn');
            confirmBtn.onclick = () => {
                customAlertModal.hide();
                resolve(true);
            };

            // Ao fechar o modal por qualquer outro meio (esc, clique fora, X), resolve como false
            document.getElementById('customAlertModal').addEventListener('hidden.bs.modal', () => {
                resolve(false);
            }, { once: true }); // Executa apenas uma vez

            customAlertModal.show();
        });
    }
    // --- Fim das Funções do Modal Customizado ---


    // Função para carregar agendamentos na tabela E ATUALIZAR currentAppointments
    async function carregarAgendamentos() {
      const tabelaBody = document.getElementById('tabelaAgendamentos');
      tabelaBody.innerHTML = '<tr><td colspan="4" class="text-center">Carregando agendamentos...</td></tr>';

      try {
        const resposta = await fetch('/api/agendamentos');
        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }
        const eventos = await resposta.json();
        currentAppointments = eventos; // Armazena os agendamentos para validação

        tabelaBody.innerHTML = ''; // Limpa a tabela antes de popular

        if (eventos.length === 0) {
          tabelaBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Nenhum agendamento encontrado.</td></tr>`;
          return;
        }

        eventos.forEach(evento => {
          const tr = document.createElement('tr');
          // Usamos os nomes das colunas 'nome', 'data_agendamento' e 'tipo_terapia' do backend
          tr.innerHTML = `
            <td>${evento.nome || 'N/A'}</td>
            <td>${new Date(evento.data_agendamento).toLocaleString('pt-BR')}</td>
            <td>${evento.tipo_terapia || 'N/A'}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="excluirAgendamento('${evento.id}')">
                Excluir
              </button>
            </td>
          `;
          tabelaBody.appendChild(tr);
        });
      } catch (erro) {
        console.error('Erro ao carregar agendamentos:', erro);
        tabelaBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Erro ao carregar agendamentos.</td></tr>`;
      }
    }

    // Função para excluir agendamento
    async function excluirAgendamento(id) {
      // Substitui o confirm() nativo pelo modal customizado
      const result = await showClinicalConfirm('Tem certeza?', "Você não poderá reverter isso!");

      if (result) { // Se o usuário clicou em 'Confirmar'
        try {
          const resposta = await fetch(`/api/agendamentos/${id}`, {
            method: 'DELETE'
          });
          if (!resposta.ok) {
            // Se a resposta não foi OK, tente obter o texto do erro
            const errorText = await resposta.text();
            console.error('Erro de resposta do servidor:', resposta.status, errorText);
            // Mensagem mais específica para 404
            if (resposta.status === 404) {
                throw new Error('Erro 404: A rota de exclusão no servidor não foi encontrada. Verifique o backend.');
            } else {
                throw new Error(`Erro ao excluir agendamento: ${errorText || resposta.statusText}`);
            }
          }
          carregarAgendamentos(); // Recarrega a lista após a exclusão
          // Alerta de sucesso com Toastr.js
          toastr.success('O agendamento foi excluído com sucesso!', 'Excluído!');
        } catch (erro) {
          console.error('Erro ao excluir:', erro);
          // Alerta de erro com modal customizado, usando a mensagem mais específica do throw
          showClinicalAlert('Erro!', erro.message || 'Ocorreu um erro ao excluir o agendamento.', 'error');
        }
      }
    }

    // Função para calcular a idade
    function calcularIdade() {
      const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');
      const idadeInput = document.querySelector('input[name="idade"]');

      if (!dataNascimentoInput || !idadeInput) {
        console.warn("Campos de data de nascimento ou idade não encontrados.");
        return;
      }

      const dataNascimentoStr = dataNascimentoInput.value;

      if (dataNascimentoStr) {
        const dataNascimento = new Date(dataNascimentoStr + 'T00:00:00'); // Adiciona T00:00:00 para evitar problemas de fuso horário
        const hoje = new Date();

        // Validação para datas de nascimento no futuro
        if (dataNascimento > hoje) {
          idadeInput.value = ''; // Limpa a idade se a data for no futuro
          showClinicalAlert('Data de Nascimento Inválida', 'A data de nascimento não pode ser no futuro.', 'warning');
          return;
        }

        let idade = hoje.getFullYear() - dataNascimento.getFullYear();
        const mes = hoje.getMonth() - dataNascimento.getMonth();

        if (mes < 0 || (mes === 0 && hoje.getDate() < dataNascimento.getDate())) {
          idade--; // Ainda não fez aniversário neste ano
        }
        idadeInput.value = idade;
      } else {
        idadeInput.value = ''; // Limpa o campo idade se a data de nascimento estiver vazia
      }
    }

    // Função para verificar conflito de agendamento
    async function checkAppointmentConflict(newAppointmentDateTimeStr, currentAppointmentId = null) {
      const newStart = new Date(newAppointmentDateTimeStr);
      const newEnd = new Date(newStart.getTime() + APPOINTMENT_DURATION_MS);

      // Recarrega os agendamentos mais recentes antes de validar
      // Isso é CRUCIAL para garantir que currentAppointments esteja sempre atualizado.
      await carregarAgendamentos();

      // Se não há agendamentos existentes, não há conflito.
      if (currentAppointments.length === 0) {
        return { hasConflict: false };
      }

      for (const existingAppt of currentAppointments) {
        // Ignora o agendamento atual se estivermos editando
        if (currentAppointmentId && existingAppt.id === currentAppointmentId) {
          continue;
        }

        const existingStart = new Date(existingAppt.data_agendamento);
        const existingEnd = new Date(existingStart.getTime() + APPOINTMENT_DURATION_MS);

        // Verifica se há sobreposição de horários
        // Um conflito existe se (Novo Início < Fim Existente) E (Novo Fim > Início Existente)
        if (newStart < existingEnd && newEnd > existingStart) {
          return {
            hasConflict: true,
            message: `O horário de ${new Date(existingAppt.data_agendamento).toLocaleString('pt-BR')} (com duração de 10 horas) já está ocupado por ${existingAppt.nome || 'outro paciente'}. Por favor, escolha outro horário.`
          };
        }
      }
      return { hasConflict: false };
    }


    // Listener para o formulário de agendamento
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOMContentLoaded disparado.'); // Log de depuração: Confirma o carregamento do DOM

      const formAgendamento = document.getElementById('formAgendamento');
      if (formAgendamento) {
        console.log('Elemento formAgendamento encontrado. Anexando listener de submit.'); // Log de depuração
        formAgendamento.addEventListener('submit', async function (e) {
          console.log('--- ENTRADA NA FUNÇÃO DE SUBMISSÃO DO FORMULÁRIO ---'); // Log de depuração
          e.preventDefault(); // Previne o comportamento padrão de recarregar a página
          const form = e.target;
          const formData = new FormData(form);
          console.log('1. Evento de submit do formulário acionado. FormData criado.'); // Log de depuração

          const errors = []; // Array para coletar mensagens de erro

          // --- CAPITALIZAÇÃO DO NOME DO PACIENTE ---
          let nomePaciente = form.querySelector('input[name="nome"]').value.trim();
          if (!nomePaciente) { // Validação de campo obrigatório antes da capitalização
            errors.push('O campo "Nome do Paciente" é obrigatório.');
          } else {
            nomePaciente = capitalizeWords(nomePaciente); // Capitaliza o nome
            formData.set('nome', nomePaciente); // Atualiza o FormData com o nome capitalizado
          }

          const tipoTerapia = form.querySelector('select[name="tipo_terapia"]').value;
          if (!tipoTerapia) {
            errors.push('Selecione um "Tipo de Terapia".');
          }

          const dataAgendamento = form.querySelector('input[name="data_agendamento"]').value;
          if (!dataAgendamento) {
            errors.push('O campo "Data e Hora do Agendamento" é obrigatório.');
          } else {
            const dataHora = new Date(dataAgendamento);
            if (isNaN(dataHora.getTime())) { // Verifica se a data é inválida
              errors.push('A "Data e Hora do Agendamento" é inválida.');
            } else if (dataHora < new Date()) {
              errors.push('A "Data e Hora do Agendamento" não pode ser no passado.');
            }
          }

          // --- MELHORIA: Tratamento de decimais (vírgula para ponto) e validação numérica ---
          const pesoInput = form.querySelector('input[name="peso"]');
          let pesoValue = pesoInput ? pesoInput.value.replace(',', '.') : '';
          if (pesoValue && (isNaN(parseFloat(pesoValue)) || parseFloat(pesoValue) <= 0)) {
            errors.push('O "Peso" deve ser um número válido e maior que zero.');
          }
          if (pesoInput) formData.set('peso', pesoValue);

          const alturaInput = form.querySelector('input[name="altura"]');
          let alturaValue = alturaInput ? alturaInput.value.replace(',', '.') : '';
          if (alturaValue && (isNaN(parseFloat(alturaValue)) || parseFloat(alturaValue) <= 0)) {
            errors.push('A "Altura" deve ser um número válido e maior que zero.');
          }
          if (alturaInput) formData.set('altura', alturaValue);

          // --- Validação da idade ---
          const idadeCalculada = document.querySelector('input[name="idade"]').value;
          const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');

          if (dataNascimentoInput.value) { // Só valida idade se a data de nascimento foi preenchida
            if (isNaN(parseInt(idadeCalculada)) || parseInt(idadeCalculada) < 0) {
              errors.push('A idade calculada é inválida ou menor que zero. Verifique a data de nascimento.');
            }
          }
          // Campo idade é readonly, então a validação principal da idade vem de calcularIdade()

          // Adiciona o campo 'condicoes' ao FormData
          const condicoesSelecionadas = Array.from(form.querySelectorAll('input[name="condicoes[]"]:checked'))
                                           .map(checkbox => checkbox.value);
          formData.set('condicoes', condicoesSelecionadas.join(', '));
          console.log('2.5. Campos de peso e altura ajustados, e condicoes/idade adicionados ao FormData.'); // Log de depuração

          // Se houver erros de validação inicial, exibe e para
          if (errors.length > 0) {
            showClinicalAlert('Erro de Validação', errors.join('<br>'), 'error');
            console.error('Erros de validação inicial:', errors);
            return; // Impede a submissão do formulário
          }

          // --- VALIDAÇÃO DE CONFLITO DE HORÁRIO ---
          // O id do agendamento atual (se estiver editando) seria passado aqui. Como estamos apenas criando, é null.
          const conflictResult = await checkAppointmentConflict(dataAgendamento, null);
          if (conflictResult.hasConflict) {
            showClinicalAlert('Horário Indisponível', conflictResult.message, 'warning');
            console.warn('Conflito de agendamento detectado:', conflictResult.message);
            return; // Impede a submissão do formulário
          }

          try {
            console.log('5. Tentando enviar a requisição fetch para /api/agendamentos...'); // Log de depuração
            const response = await fetch('/api/agendamentos', {
              method: 'POST',
              body: formData
            });
            console.log('6. Requisição fetch enviada. Resposta recebida. Status:', response.status); // Log de depuração

            if (response.ok) {
              toastr.success('Agendamento e paciente salvos com sucesso!', 'Sucesso!');
              form.reset(); // Limpa o formulário após o sucesso
              carregarAgendamentos(); // Recarrega a lista para mostrar o novo agendamento
            } else {
              const errorText = await response.text();
              console.error('7. Erro ao salvar agendamento. Resposta do servidor:', errorText); // Log de erro
              showClinicalAlert(
                'Erro ao Salvar',
                `Ocorreu um erro ao salvar o agendamento. Por favor, tente novamente.<br><pre>${errorText.substring(0, 200)}...</pre>`,
                'error'
              );
            }
          } catch (erro) {
            console.error('8. Erro ao enviar o agendamento (catch do fetch):', erro); // Log de erro em caso de falha de rede ou JS
            showClinicalAlert('Erro de Conexão', 'Não foi possível conectar ao servidor. Verifique sua conexão.', 'error');
          }
        });
      } else {
        console.error('Erro: Elemento formAgendamento não encontrado!'); // Log de erro se o formulário não for encontrado no DOM
      }

      // Adiciona o listener para o campo de data de nascimento para calcular a idade
      const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');
      if (dataNascimentoInput) {
        dataNascimentoInput.addEventListener('change', calcularIdade);
      }
      carregarAgendamentos(); // Garante que a listagem carregue ao iniciar a página
    });
  </script>
</body>
</html>
