<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Agendar Consulta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.0/dist/sweetalert2.min.css">
  <!-- Arquivos css personalizados (certifique-se de que os caminhos estão corretos) -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animacaoBack.css">
</head>
<body class="menosClaro">
  <div class="container mt-5">
    <h2 class="mb-4">Agendamento de Consulta</h2>

    <form class="row g-3" id="formAgendamento" enctype="multipart/form-data">

      <!-- Dados do paciente e consulta -->
      <div class="col-md-6">
        <label for="nomePaciente" class="form-label">Nome do Paciente</label>
        <input type="text" id="nomePaciente" name="nome" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label for="dataNascimentoPaciente" class="form-label">Data de Nascimento do Paciente</label>
        <input type="date" id="dataNascimentoPaciente" name="data_nascimento" class="form-control">
      </div>

      <div class="col-md-3">
        <label for="idadePaciente" class="form-label">Idade do Paciente</label>
        <input type="number" id="idadePaciente" name="idade" class="form-control" readonly> <!-- 'readonly' para evitar edição manual -->
      </div>

      <div class="col-md-4">
        <label for="pesoPaciente" class="form-label">Peso (kg)</label>
        <input type="number" id="pesoPaciente" name="peso" step="0.1" class="form-control">
      </div>

      <div class="col-md-4">
        <label for="alturaPaciente" class="form-label">Altura (cm)</label>
        <input type="number" id="alturaPaciente" name="altura" step="0.1" class="form-control">
      </div>

      <div class="col-md-4">
        <label for="tipoSanguineoPaciente" class="form-label">Tipo Sanguíneo</label>
        <select class="form-select" id="tipoSanguineoPaciente" name="tipo_sanguineo">
          <option value="">Selecione</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
          <option>O+</option><option>O-</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="tipoTerapia" class="form-label">Tipo de Terapia</label>
        <select class="form-select" id="tipoTerapia" name="tipo_terapia" required>
          <option value="">Escolha uma opção</option>
          <option>Terapia Clark</option>
          <option>Biofísica</option>
          <option>Ortomolecular</option>
          <option>Microscopia</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="dataHoraAgendamento" class="form-label">Data e Hora do Agendamento</label>
        <input type="datetime-local" id="dataHoraAgendamento" name="data_agendamento" class="form-control" required>
      </div>

      <div class="col-12">
        <label for="motivoConsulta" class="form-label">Motivo da Consulta</label>
        <textarea class="form-control" id="motivoConsulta" name="motivo_consulta" rows="2"></textarea>
      </div>

      <div class="col-12">
        <label for="origemIndicacao" class="form-label">Como conheceu o consultório?</label>
        <select class="form-select" id="origemIndicacao" name="origem_indicacao">
          <option value="">Selecione</option>
          <option>Indicação</option>
          <option>Instagram</option>
          <option>Google</option>
          <option>Facebook</option>
          <option>Outro</option>
        </select>
      </div>

      <!-- Campo de Observações -->
      <div class="col-12">
        <label for="observacoes" class="form-label">Observações</label>
        <textarea class="form-control" id="observacoes" name="observacoes" rows="2"></textarea>
      </div>

      <!-- Condições de Saúde (coletadas como string) -->
      <div class="col-12">
        <h5 class="mt-4">Condições de Saúde</h5>
        <div class="row">
          <div class="col-md-4">
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Hipertensão" id="condicaoHipertensao"><label class="form-check-label" for="condicaoHipertensao">Hipertensão</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Diabetes" id="condicaoDiabetes"><label class="form-check-label" for="condicaoDiabetes">Diabetes</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Resistência Insulínica" id="condicaoResistencia"><label class="form-check-label" for="condicaoResistencia">Resistência Insulínica</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Hipotireoidismo" id="condicaoHipotireoidismo"><label class="form-check-label" for="condicaoHipotireoidismo">Hipotireoidismo</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Problemas Cardíacos" id="condicaoCardiacos"><label class="form-check-label" for="condicaoCardiacos">Problemas Cardíacos</label></div>
          </div>
          <div class="col-md-4">
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Neurológico" id="condicaoNeurologico"><label class="form-check-label" for="condicaoNeurologico">Neurológico</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Disfunção Hepática" id="condicaoHepatica"><label class="form-check-label" for="condicaoHepatica">Disfunção Hepática</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Renal" id="condicaoRenal"><label class="form-check-label" for="condicaoRenal">Problemas Renais</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="TDAH" id="condicaoTDAH"><label class="form-check-label" for="condicaoTDAH">TDAH</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="TEA" id="condicaoTEA"><label class="form-check-label" for="condicaoTEA">TEA (Espectro Autista)</label></div>
          </div>
          <div class="col-md-4">
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Fibromialgia" id="condicaoFibromialgia"><label class="form-check-label" for="condicaoFibromialgia">Fibromialgia</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Ansiedade" id="condicaoAnsiedade"><label class="form-check-label" for="condicaoAnsiedade">Ansiedade</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Depressão" id="condicaoDepressao"><label class="form-check-label" for="condicaoDepressao">Depressão</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Autoimune" id="condicaoAutoimune"><label class="form-check-label" for="condicaoAutoimune">Doença Autoimune</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Alergias" id="condicaoAlergias"><label class="form-check-label" for="condicaoAlergias">Alergias</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Remedios" id="condicaoRemedios"><label class="form-check-label" for="condicaoRemedios">Remedios</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Suplementos" id="condicaoSuplementos"><label class="form-check-label" for="condicaoSuplementos">Suplementos</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" name="condicoes[]" value="Vitaminas" id="condicaoVitaminas"><label class="form-check-label" for="condicaoVitaminas">Vitaminas</label></div>
          </div>
        </div>
      </div>

      <div class="col-12 mt-4">
        <label for="anexo" class="form-label">Anexar Exames ou Imagens (opcional)</label>
        <input type="file" id="anexo" name="anexo" class="form-control">
      </div>

      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary mt-3">Salvar Agendamento</button>
      </div>
    </form>
  </div>

  ---

  <div class="container mt-5">
      <div class="mt-5">
        <h4 class="mb-3">Agendamentos Registrados</h4>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Paciente</th>
                <th>Data</th>
                <th>Terapia</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="tabelaAgendamentos">
              <tr>
                <td colspan="4" class="text-center">Carregando agendamentos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.0/dist/sweetalert2.all.min.js"></script>
  <script>
    console.log('Script agendamentos.html carregado.'); // Log de depuração: Primeiro log do script

    // Função para carregar agendamentos na tabela
    async function carregarAgendamentos() {
      const tabelaBody = document.getElementById('tabelaAgendamentos');
      tabelaBody.innerHTML = '<tr><td colspan="4" class="text-center">Carregando agendamentos...</td></tr>';

      try {
        const resposta = await fetch('/api/agendamentos');
        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }
        const eventos = await resposta.json();

        tabelaBody.innerHTML = ''; // Limpa a tabela antes de popular

        if (eventos.length === 0) {
          tabelaBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Nenhum agendamento encontrado.</td></tr>`;
          return;
        }

        eventos.forEach(evento => {
          const tr = document.createElement('tr');
          // Usamos os nomes das colunas 'nome', 'data_agendamento' e 'tipo_terapia' do backend
          tr.innerHTML = `
            <td>${evento.nome || 'N/A'}</td>
            <td>${new Date(evento.data_agendamento).toLocaleString('pt-BR')}</td>
            <td>${evento.tipo_terapia || 'N/A'}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="excluirAgendamento('${evento.id}')">
                Excluir
              </button>
            </td>
          `;
          tabelaBody.appendChild(tr);
        });
      } catch (erro) {
        console.error('Erro ao carregar agendamentos:', erro);
        tabelaBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Erro ao carregar agendamentos.</td></tr>`;
      }
    }

    // Função para excluir agendamento
    async function excluirAgendamento(id) {
      // Substitui o confirm() nativo pelo SweetAlert2
      const result = await Swal.fire({
        title: 'Tem certeza?',
        text: "Você não poderá reverter isso!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      });

      if (result.isConfirmed) {
        try {
          const resposta = await fetch(`/api/agendamentos/${id}`, {
            method: 'DELETE'
          });
          if (!resposta.ok) {
            throw new Error('Erro ao excluir agendamento');
          }
          carregarAgendamentos(); // Recarrega a lista após a exclusão
          // Alerta de sucesso com SweetAlert2
          Swal.fire(
            'Excluído!',
            'O agendamento foi excluído com sucesso.',
            'success'
          );
        } catch (erro) {
          console.error('Erro ao excluir:', erro);
          // Alerta de erro com SweetAlert2
          Swal.fire(
            'Erro!',
            'Ocorreu um erro ao excluir o agendamento.',
            'error'
          );
        }
      }
    }

    // Função para calcular a idade
    function calcularIdade() {
      const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');
      const idadeInput = document.querySelector('input[name="idade"]');

      if (!dataNascimentoInput || !idadeInput) {
        console.warn("Campos de data de nascimento ou idade não encontrados.");
        return;
      }

      const dataNascimentoStr = dataNascimentoInput.value;

      if (dataNascimentoStr) {
        const dataNascimento = new Date(dataNascimentoStr + 'T00:00:00'); // Adiciona T00:00:00 para evitar problemas de fuso horário
        const hoje = new Date();

        // Validação para datas de nascimento no futuro
        if (dataNascimento > hoje) {
          idadeInput.value = ''; // Limpa a idade se a data for no futuro
          Swal.fire({
            icon: 'warning',
            title: 'Data de Nascimento Inválida',
            text: 'A data de nascimento não pode ser no futuro.',
            confirmButtonText: 'Entendi'
          });
          return;
        }

        let idade = hoje.getFullYear() - dataNascimento.getFullYear();
        const mes = hoje.getMonth() - dataNascimento.getMonth();

        if (mes < 0 || (mes === 0 && hoje.getDate() < dataNascimento.getDate())) {
          idade--; // Ainda não fez aniversário neste ano
        }
        idadeInput.value = idade;
      } else {
        idadeInput.value = ''; // Limpa o campo idade se a data de nascimento estiver vazia
      }
    }

    // Listener para o formulário de agendamento
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOMContentLoaded disparado.'); // Log de depuração: Confirma o carregamento do DOM

      const formAgendamento = document.getElementById('formAgendamento');
      if (formAgendamento) {
        console.log('Elemento formAgendamento encontrado. Anexando listener de submit.'); // Log de depuração
        formAgendamento.addEventListener('submit', async function (e) {
          console.log('--- ENTRADA NA FUNÇÃO DE SUBMISSÃO DO FORMULÁRIO ---'); // Log de depuração
          e.preventDefault(); // Previne o comportamento padrão de recarregar a página
          const form = e.target;
          const formData = new FormData(form);
          console.log('1. Evento de submit do formulário acionado. FormData criado.'); // Log de depuração

          const errors = []; // Array para coletar mensagens de erro

          // --- Validação de campos de texto e seleção obrigatórios (além do 'required' do HTML5) ---
          const nomePaciente = form.querySelector('input[name="nome"]').value.trim();
          if (!nomePaciente) {
            errors.push('O campo "Nome do Paciente" é obrigatório.');
          }

          const tipoTerapia = form.querySelector('select[name="tipo_terapia"]').value;
          if (!tipoTerapia) {
            errors.push('Selecione um "Tipo de Terapia".');
          }

          const dataAgendamento = form.querySelector('input[name="data_agendamento"]').value;
          if (!dataAgendamento) {
            errors.push('O campo "Data e Hora do Agendamento" é obrigatório.');
          } else {
            const dataHora = new Date(dataAgendamento);
            if (isNaN(dataHora.getTime())) { // Verifica se a data é inválida
              errors.push('A "Data e Hora do Agendamento" é inválida.');
            } else if (dataHora < new Date()) {
              errors.push('A "Data e Hora do Agendamento" não pode ser no passado.');
            }
          }

          // --- MELHORIA: Tratamento de decimais (vírgula para ponto) e validação numérica ---
          const pesoInput = form.querySelector('input[name="peso"]');
          let pesoValue = pesoInput ? pesoInput.value.replace(',', '.') : '';
          if (pesoValue && (isNaN(parseFloat(pesoValue)) || parseFloat(pesoValue) <= 0)) {
            errors.push('O "Peso" deve ser um número válido e maior que zero.');
          }
          if (pesoInput) formData.set('peso', pesoValue);

          const alturaInput = form.querySelector('input[name="altura"]');
          let alturaValue = alturaInput ? alturaInput.value.replace(',', '.') : '';
          if (alturaValue && (isNaN(parseFloat(alturaValue)) || parseFloat(alturaValue) <= 0)) {
            errors.push('A "Altura" deve ser um número válido e maior que zero.');
          }
          if (alturaInput) formData.set('altura', alturaValue);

          // --- Validação da idade ---
          const idadeCalculada = document.querySelector('input[name="idade"]').value;
          const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');

          if (dataNascimentoInput.value && (isNaN(parseInt(idadeCalculada)) || parseInt(idadeCalculada) < 0)) {
            // Se a data de nascimento foi preenchida, mas a idade calculada é inválida (negativa)
            errors.push('A idade calculada é inválida. Verifique a data de nascimento.');
          } else if (dataNascimentoInput.value && parseInt(idadeCalculada) === 0 && new Date(dataNascimentoInput.value) > new Date()) {
             // Caso a data de nascimento esteja no futuro, e a idade seja 0. Já validado em calcularIdade, mas reforçando.
             errors.push('A data de nascimento não pode ser no futuro.');
          }
          // Se a idade for 0 e a data de nascimento for HOJE, isso é válido para um recém-nascido.
          // A regra "idade menor que 0" já está coberta pela validação acima.

          // Adiciona o campo 'condicoes' ao FormData
          const condicoesSelecionadas = Array.from(form.querySelectorAll('input[name="condicoes[]"]:checked'))
                                           .map(checkbox => checkbox.value);
          formData.set('condicoes', condicoesSelecionadas.join(', '));
          console.log('2.5. Campos de peso e altura ajustados, e condicoes/idade adicionados ao FormData.'); // Log de depuração

          // Se houver erros, exibe o alerta e impede a submissão
          if (errors.length > 0) {
            Swal.fire({
              icon: 'error',
              title: 'Erro de Validação',
              html: errors.join('<br>'), // Exibe todos os erros em uma lista
              confirmButtonText: 'Corrigir'
            });
            console.error('Erros de validação:', errors);
            return; // Impede a submissão do formulário
          }

          try {
            console.log('5. Tentando enviar a requisição fetch para /api/agendamentos...'); // Log de depuração
            const response = await fetch('/api/agendamentos', {
              method: 'POST',
              body: formData
            });
            console.log('6. Requisição fetch enviada. Resposta recebida. Status:', response.status); // Log de depuração

            if (response.ok) {
              Swal.fire({
                icon: 'success',
                title: 'Sucesso!',
                text: 'Agendamento e paciente salvos com sucesso!',
                showConfirmButton: false,
                timer: 1500
              });
              form.reset(); // Limpa o formulário após o sucesso
              carregarAgendamentos(); // Recarrega a lista para mostrar o novo agendamento
            } else {
              const errorText = await response.text();
              console.error('7. Erro ao salvar agendamento. Resposta do servidor:', errorText); // Log de erro
              Swal.fire({
                icon: 'error',
                title: 'Erro ao Salvar',
                text: 'Ocorreu um erro ao salvar o agendamento. Por favor, tente novamente.',
                footer: `<pre>${errorText.substring(0, 200)}...</pre>`, // Mostra parte do erro do servidor
                confirmButtonText: 'Entendi'
              });
            }
          } catch (erro) {
            console.error('8. Erro ao enviar o agendamento (catch do fetch):', erro); // Log de erro em caso de falha de rede ou JS
            Swal.fire({
              icon: 'error',
              title: 'Erro de Conexão',
              text: 'Não foi possível conectar ao servidor. Verifique sua conexão.',
              confirmButtonText: 'Ok'
            });
          }
        });
      } else {
        console.error('Erro: Elemento formAgendamento não encontrado!'); // Log de erro se o formulário não for encontrado no DOM
      }

      // Adiciona o listener para o campo de data de nascimento para calcular a idade
      const dataNascimentoInput = document.querySelector('input[name="data_nascimento"]');
      if (dataNascimentoInput) {
        dataNascimentoInput.addEventListener('change', calcularIdade);
      }
      carregarAgendamentos(); // Garante que a listagem carregue ao iniciar a página
    });
  </script>
</body>
</html>
