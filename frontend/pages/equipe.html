<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Equipe | Painel Administrativo</title>

    <link rel="stylesheet" href="../css/stiloDataHora.css">
    <link rel="stylesheet" href="../css/stileLogo.css">
    <link rel="stylesheet" href="../css/darckModeStile.css">
    <link rel="stylesheet" href="../css/animacaoBack.css">
    <script src="../ScriptGlobal/BloqBotVoltar.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-light border-bottom shadow-sm mb-4 w-full py-3">
        <div class="container-fluid px-5">
            <div class="flex items-center justify-between min-h-[60px]">

                <div class="flex items-center flex-shrink-0">
                    <a class="text-3xl font-bold text-primary no-underline flex items-center" href="/dashboard">
                        <span class="logo-img leading-none">MedLM</span>
                    </a>
                </div>

                <div class="hidden md:flex items-center space-x-3">
                    <div id="data-hora-container" class="me-4 text-muted border-end pe-4 hidden lg:block">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="data-hora" class="font-medium"></span>
                    </div>

                    <a href="/dashboard" class="btn btn-outline-primary px-4">Dashboard</a>
                    <a href="/pacientes" class="btn btn-outline-primary px-4">Pacientes</a>
                    <a href="/agendamento" class="btn btn-outline-success px-4">Agendar</a>

                    <button id="theme-toggle-btn" class="btn btn-outline-dark mx-2">
                        <i class="fas fa-moon"></i>
                    </button>

                    <a href="javascript:void(0)" onclick="handleLogout(event)" class="btn btn-danger px-4 font-bold">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </a>
                </div>

                <button onclick="document.getElementById('navbarNav').classList.toggle('hidden')" class="md:hidden p-3 rounded-md border border-gray-300">
                    <i class="fas fa-bars text-gray-600"></i>
                </button>
            </div>

            <div id="navbarNav" class="hidden md:hidden mt-3 pb-3">
                <div class="flex flex-col space-y-3">
                    <a href="/dashboard" class="nav-link text-primary fs-5">Dashboard</a>
                    <a href="/pacientes" class="nav-link text-primary fs-5">Pacientes</a>
                    <a href="/agendamento" class="nav-link text-success fs-5">Agendar</a>
                    <a href="/equipe" class="nav-link text-success font-bold fs-5 border-start border-4 border-success ps-2">Minha Equipe</a>
                    <hr>
                    <a href="javascript:void(0)" onclick="handleLogout(event)" class="btn btn-outline-danger w-full text-left">Sair</a>
                </div>
            </div>
        </div>
    </nav>


    <div class="container mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Gerenciar Equipe</h1>
            <button onclick="toggleModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
                + Adicionar Membro
            </button>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-200 text-gray-600 uppercase text-sm">
                        <th class="py-3 px-6 text-left">Nome</th>
                        <th class="py-3 px-6 text-left">Cargo</th>
                        <th class="py-3 px-6 text-left">E-mail</th>
                    </tr>
                </thead>
                <tbody id="lista-equipe">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modalMembro" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h2 class="text-xl font-bold mb-4">Adicionar Novo Membro</h2>

            <form id="formMembro" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                    <input type="text" name="nome" required class="w-full mt-1 p-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail (Login)</label>
                    <input type="email" name="email" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha Provisória</label>
                    <input type="password" name="senha" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cargo</label>
                    <select name="cargo" class="w-full mt-1 p-2 border rounded-md">
                        <option value="terapeuta">Terapeuta</option>
                        <option value="recepcao">Recepcionista</option>
                        <option value="administrador">Administrativo</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="toggleModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">Salvar Membro</button>
                </div>
            </form>
        </div>
    </div>
    <!-- ==== modal de sucesso para novo integrante cadastrado === -->
    <div id="toast-sucesso" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-500 ease-in-out z-50">
        <div class="bg-emerald-500 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center space-x-3">
            <div class="bg-white/20 p-2 rounded-full">
                <i class="fas fa-check text-lg"></i>
            </div>
            <div>
                <p class="font-bold">Sucesso!</p>
                <p class="text-sm opacity-90">Membro adicionado à equipe.</p>
            </div>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token');

        // Função para mostrar o Toast bonitão
        function showToast() {
            const toast = document.getElementById('toast-sucesso');
            // Mostra o toast subindo e aparecendo
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            // Esconde depois de 3 segundos
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleModal() {
            document.getElementById('modalMembro').classList.toggle('hidden');
        }

        document.getElementById('formMembro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSalvar = e.target.querySelector('button[type="submit"]');
            btnSalvar.disabled = true;
            btnSalvar.innerText = "Processando...";

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/equipe/adicionar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    toggleModal(); // Fecha o modal
                    showToast();   // MOSTRA O POPUP DO TAILWIND!
                    e.target.reset(); // Limpa o formulário
                    carregarEquipe(); // Atualiza a lista sem dar refresh na página inteira
                } else {
                    const result = await response.json();
                    alert('⚠️ ' + (result.error || 'Erro ao salvar.'));
                }
            } catch (error) {
                alert('❌ Erro de conexão.');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerText = "Salvar Membro";
            }
        });

        async function carregarEquipe() {
            try {
                const response = await fetch('/api/equipe/listar', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const membros = await response.json();
                const tabela = document.getElementById('lista-equipe');
                tabela.innerHTML = '';

                membros.forEach(membro => {
                    tabela.innerHTML += `
                        <tr class="border-b hover:bg-slate-50 transition">
                            <td class="py-3 px-6 text-slate-700 font-medium">${membro.nome}</td>
                            <td class="py-3 px-6">
                                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full uppercase">
                                    ${membro.cargo}
                                </span>
                            </td>
                            <td class="py-3 px-6 text-slate-500">${membro.email}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar equipe:", error);
            }
        }



        window.onload = carregarEquipe;
    </script>
     <script src="../ScriptGlobal/FuncDataHora.js"></script>
     <script src="../ScriptGlobal/DarkMode.js"></script>
     <script src="../ScriptGlobal/verifiLog.js"></script>
     <script src="../ScriptGlobal/logout.js"></script>
</body>
</html>
