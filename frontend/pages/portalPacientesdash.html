<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); }
        body { background: linear-gradient(135deg, #064e3b 0%, #0e7490 50%, #1e3a8a 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-white p-6">
    <div class="max-w-md mx-auto">
        <h1 id="boasVindas" class="text-3xl font-bold mb-8">Carregando...</h1>
        
        <div id="carrossel" class="glass p-6 rounded-3xl h-40 flex items-center justify-center overflow-hidden relative">
            <div id="slides" class="text-center"></div>
        </div>
    </div>

    <script>
        async function carregarDados() {
    try {
        const res = await fetch('/portal_paciente/api/dados');
        if (!res.ok) throw new Error('Erro ao buscar dados');
        
        const data = await res.json();
        
        document.getElementById('boasVindas').innerText = `Olá, ${data.paciente.nome}!`;
        
        const slides = document.getElementById('slides');
        const ags = data.agendamentos;

        if (!ags || ags.length === 0) {
            slides.innerHTML = `<p>Nenhum agendamento futuro encontrado.</p>`;
            return;
        }

        let i = 0;
        const atualizarSlide = () => {
            // Adiciona um pequeno efeito de transição via classe do Tailwind
            slides.classList.add('opacity-0'); 
            
            setTimeout(() => {
                slides.innerHTML = `
                    <p class="text-emerald-300 font-bold uppercase text-xs">Próxima Consulta</p>
                    <p class="text-2xl font-bold">${new Date(ags[i].data_agendamento).toLocaleDateString('pt-BR')}</p>
                    <p class="text-sm opacity-90 italic">${ags[i].tipo_terapia}</p>`;
                
                slides.classList.remove('opacity-0');
            }, 300);
            
            i = (i + 1) % ags.length;
        };

        atualizarSlide(); // Primeira execução imediata
        setInterval(atualizarSlide, 4000);

    } catch (err) {
        console.error(err);
        document.getElementById('boasVindas').innerText = "Erro ao carregar dados.";
    }
}
        
        carregarDados();
    </script>
</body>
</html>
