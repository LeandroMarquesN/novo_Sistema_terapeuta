<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Nova Senha - MedLM Sistema Terapêutico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="/logo/faviicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animacaoBack.css">

  <style>
    :root {
      --emerald:   #34d399;
      --emerald-d: #059669;
      --cyan:      #22d3ee;
      --slate-bg:  #020c12;
      --border:    rgba(52,211,153,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--slate-bg);
      background-image:
        radial-gradient(ellipse 70% 60% at 20% 0%,   rgba(8,145,178,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 60% 55% at 80% 100%, rgba(5,150,105,0.20) 0%, transparent 65%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #cbd5e1;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
      pointer-events: none; z-index: 0;
    }

    .orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(80px); z-index: 0; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(8,145,178,0.18), transparent 70%); top: -15%; left: -10%; }
    .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(5,150,105,0.15), transparent 70%); bottom: -10%; right: -8%; }

    .login-wrap { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 20px; }

    .login-container {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 40px;
      backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 60px rgba(8,145,178,0.08);
      position: relative;
    }

    .logo-wrapper { text-align: center; margin-bottom: 28px; }
    span.logo-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--emerald));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: block; margin-bottom: 4px;
    }
    .logo-tagline { font-size: 11px; font-weight: 600; color: rgba(148,163,184,0.4); text-transform: uppercase; letter-spacing: 0.18em; }

    .login-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px; font-weight: 800; color: #f1f5f9;
      margin-bottom: 28px; display: flex; align-items: center; gap: 8px;
    }

    #message-box {
      display: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 20px;
      text-align: center;
    }
    .msg-error { background: rgba(248,113,113,0.10); border: 1px solid rgba(248,113,113,0.25); color: #fca5a5; }
    .msg-success { background: rgba(52,211,153,0.10); border: 1px solid rgba(52,211,153,0.25); color: #34d399; }

    .field-wrap { margin-bottom: 18px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: rgba(148,163,184,0.5); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 7px; }
    
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(52,211,153,0.4); font-size: 14px; }

    .form-control {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 14px;
      color: #e2e8f0; font-size: 14px; padding: 13px 14px 13px 42px; outline: none; transition: all 0.25s;
    }
    .form-control:focus { border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.04); box-shadow: 0 0 0 3px rgba(52,211,153,0.08); }

    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #0891b2 0%, #059669 100%);
      border: 1px solid rgba(52,211,153,0.3); color: #fff;
      font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 800;
      padding: 14px; border-radius: 16px; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 0 24px rgba(8,145,178,0.35); margin-top: 8px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(8,145,178,0.55); }
    .btn-primary.loading { pointer-events: none; opacity: 0.8; }
  </style>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrap">
    <div class="login-container">
      <div class="logo-wrapper">
        <span class="logo-brand">MedLM</span>
        <span class="logo-tagline">Sistema Terapêutico</span>
      </div>

      <h2 class="login-heading">
        <i class="fas fa-key" style="color:var(--emerald);font-size:14px"></i>
        Criar Nova Senha
      </h2>

      <div id="message-box"></div>

      <form id="resetForm">
        <div class="field-wrap">
          <label for="newPassword" class="form-label">Nova Senha</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <div class="field-wrap">
          <label for="confirmPassword" class="form-label">Confirmar Nova Senha</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <i class="fas fa-save" style="margin-right:8px"></i> Salvar Nova Senha
        </button>
      </form>
    </div>
  </div>

  <script>
    // Pega o token direto da URL (ex: ?token=abc123xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const msgBox = document.getElementById('message-box');

    if (!token) {
      msgBox.className = 'msg-error';
      msgBox.textContent = 'Token de recuperação inválido ou ausente.';
      msgBox.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      msgBox.style.display = 'none';

      if (newPassword !== confirmPassword) {
        msgBox.className = 'msg-error';
        msgBox.textContent = 'As senhas não coincidem.';
        msgBox.style.display = 'block';
        return;
      }

      if (newPassword.length < 6) {
        msgBox.className = 'msg-error';
        msgBox.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        msgBox.style.display = 'block';
        return;
      }

      btn.classList.add('loading');
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin" style="margin-right:8px"></i> Salvando...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await response.json();

        if (response.ok) {
          msgBox.className = 'msg-success';
          msgBox.textContent = data.message || 'Senha alterada com sucesso!';
          msgBox.style.display = 'block';
          btn.innerHTML = '<i class="fas fa-check" style="margin-right:8px"></i> Sucesso!';

          setTimeout(() => {
            window.location.href = '/pages/login.html';
          }, 2500);
        } else {
          btn.classList.remove('loading');
          btn.innerHTML = '<i class="fas fa-save" style="margin-right:8px"></i> Salvar Nova Senha';
          msgBox.className = 'msg-error';
          msgBox.textContent = data.error || 'Erro ao redefinir a senha.';
          msgBox.style.display = 'block';
        }
      } catch (error) {
        console.error('Erro na requisição:', error);
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="fas fa-save" style="margin-right:8px"></i> Salvar Nova Senha';
        msgBox.className = 'msg-error';
        msgBox.textContent = 'Erro de conexão com o servidor.';
        msgBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
