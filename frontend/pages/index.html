<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Bem-vindo | Sistema Terapêutico</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>

<link rel="stylesheet" href="/css/style.css">
 <link rel="stylesheet" href="/css/animacaoBack.css">

<body>

    <script>
        function verificarSenhaMestre() {
          const senha = prompt('Digite a senha de acesso para cadastrar novo usuário:');
            if (senha === 'leandro') {
               window.location.href = 'cadastro-usuario.html'; // <- caminho absoluto
            } else {
              alert('Senha incorreta!');
            }
          }
    </script>
    <style>
      header.cont{

        margin-right: 3%;
        margin-left: 3%;
        border-radius: 9px;
        padding: 15px;

                  background: linear-gradient(45deg,
              #c1d6ec,  /* Azul profundo */
              #a2c9f2,  /* Azul claro */
              #60c6cb,  /* Verde-água médio */
              #e6f7ff,  /* Azul muito claro */
              #5a92d6,  /* Azul médio mais saturado */
              #d4ecf9   /* Azul suave claro */
            );
            background-size: 500% 500%;
            animation: gradientFlow 18s ease-in-out infinite;
            z-index: -1;
            opacity: 0.7
      }
      @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>

<nav class='navbar navbar-expand-lg navbar-light bg-light shadow-sm'>
    <div class='container-fluid'>
        <a class='navbar-brand' href='#'>Sistema Terapêutico</a>
          <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navbarNav'>
            <span class='navbar-toggler-icon'></span>
          </button>
      <div class='collapse navbar-collapse' id='navbarNav'>
        <ul class='navbar-nav ms-auto'>
          <li class='nav-item'>
            <a class='btn btn-outline-primary' href='login.html'>Entrar</a>
          </li>
        </ul>
      </div>
    </div>
</nav>
<header class="text-center mt-5 cont text-dark
" >
    <h1 class="fw-bold fs-1">Bem-vindo ao Sistema da Terapeuta</h1>
    <p class="lead">Organize seus pacientes, agendamentos e terapias com eficiência.</p>
    <a href="login.html" class="btn btn-primary btn-lg mt-3 me-2">Acessar o sistema</a>
    <button class="btn btn-success btn-lg mt-3" onclick="verificarSenhaMestre()">Cadastrar novo usuário</button>
</header>

<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
</body>
</html>
