<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Terapêutico | Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animacaoBack.css">

    <style>
        /* Mantendo e aprimorando seu efeito de Gradient Flow */
        .gradient-bg {
            background: linear-gradient(45deg,
                #c1d6ec, #a2c9f2, #60c6cb, #e6f7ff, #5a92d6, #d4ecf9
            );
            background-size: 400% 400%;
            animation: gradientFlow 15s ease-in-out infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <nav class="fixed w-full z-50 top-0 bg-white/70 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i class="fas fa-leaf text-white"></i>
                    </div>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500">
                        Sistema Terapêutico
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="login.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition">Entrar</a>
                    <a href="/pages/Cadastro_Clinica.html" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition transform hover:scale-105">
                        Teste Grátis
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative min-h-screen flex items-center justify-center pt-16 overflow-hidden">
        
        <div class="absolute inset-0 gradient-bg opacity-40 z-0"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto px-6 text-center">
            <div class="inline-block px-4 py-1.5 mb-6 text-sm font-medium text-blue-700 bg-blue-100 rounded-full ring-1 ring-inset ring-blue-700/10">
                Nova Versão 2.0 - Multi-tenant & Cloud 🚀
            </div>
            
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-slate-900 mb-6">
                A evolução na gestão da sua <span class="text-blue-600">clínica de terapia</span>.
            </h1>
            
            <p class="text-lg md:text-xl text-slate-600 mb-10 max-w-2xl mx-auto leading-relaxed">
                Organize pacientes, agendamentos e seu financeiro em um só lugar. Feito para profissionais que buscam escala e organização.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="/pages/Cadastro_Clinica.html" class="w-full sm:w-auto px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg shadow-2xl shadow-blue-300 hover:bg-blue-700 transition-all transform hover:-translate-y-1">
                    <i class="fas fa-rocket mr-2"></i> Criar Minha Clínica
                </a>
                
                <a href="login.html" class="w-full sm:w-auto px-8 py-4 bg-white text-slate-700 border border-slate-200 rounded-2xl font-bold text-lg shadow-sm hover:bg-slate-50 transition-all transform hover:-translate-y-1">
                    <i class="fas fa-sign-in-alt mr-2"></i> Acessar Sistema
                </a>
            </div>

            <button onclick="verificarSenhaMestre()" class="mt-12 text-slate-400 hover:text-slate-600 text-xs transition uppercase tracking-widest font-semibold">
                <i class="fas fa-lock mr-1"></i> Área do Desenvolvedor
            </button>
        </div>
    </main>

    <script>
        function verificarSenhaMestre() {
            const senha = prompt('Digite a senha de acesso mestre:');
            if (senha === 'leandro') {
                window.location.href = 'cadastro-usuario.html';
            } else {
                alert('Acesso negado!');
            }
        }
    </script>
</body>
</html>
